name: Bug report
description: Report a reproducible problem without including credentials or private transcripts.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: "Never paste bot tokens, API keys, private paths, or sensitive agent output."
  - type: input
    id: version
    attributes:
      label: Version
      placeholder: "0.1.1"
    validations:
      required: true
  - type: dropdown
    id: provider
    attributes:
      label: Agent provider
      options: [Claude Code, Codex CLI, Gemini CLI, Custom CLI, Not agent-related]
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Include exact steps and sanitized error text.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Operating system and Python version
      placeholder: "Windows 11, Python 3.12"
    validations:
      required: true
